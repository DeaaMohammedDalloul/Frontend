<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lec13_Form4</title>
</head>

<body>
    <h1>Course Registration </h1>
    <form action="" method="get">
        <label for="name">Name: </label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        <br><br>

        <label for="email">Email: </label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label for="course">Name Course: </label>
        <input type="text" id="course" name="course" placeholder="HTML or Java" required>
        <br><br>

        <label for="meetings">Number of Meetings: </label>
        <input type="number" id="meetings" name="meetings" placeholder="Enter number of meetings" required>
        <br><br>

        <label for="telphone">Telephone: </label>
        <input type="tel" id="telphone" name="telphone" placeholder="Enter your telephone number">
        <br><br>

        <button type="submit">Book Now</button>
    </form>

</body>

</html>
