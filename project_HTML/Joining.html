<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joining</title>
</head>

<body>
    <form action="admin.html" method="post" enctype="multipart/form-data">
        <fieldset>
            <legend>Joining</legend>

            <label>Name: <br><input type="text" name="name" placeholder="Enter name" required></label>
            <br><br>

            <label>Email: <br><input type="email" name="email" placeholder="Enter email" required></label>
            <br><br>

            <label>Phone number: <br><input type="tel" name="phone" placeholder="Enter phone" required></label>
            <br><br>

            <label>Enter Age: <br><input type="number" name="age" placeholder="Enter age" required></label>
            <br><br>

            <p><strong>Subscription type:</strong></p>
            <label><input type="radio" name="type" value="Annual">Annual</label><br>
            <label><input type="radio" name="type" value="Monthly">Monthly<label>
                    <br>

                    <p><strong>Desired service:</strong></p>
                    <label><input type="checkbox" name="service[]" value="Bodybuilding">Bodybuilding</label><br>

                    <label><input type="checkbox" name="service[]" value="Physical Fitness">Physical Fitness</label><br>

                    <label><input type="checkbox" name="service[]" value="Cardio">Cardio</label><br><br>

                    <label for="city">Place of residence: </label>
                    <select name="city" id="city">
                        <option>select City</option>
                        <option value="Rafah">Rafah</option>
                        <option value="Khan Youns">Khan Youns</option>
                        <option value="Central governorates">Central governorates</option>

                        <option value="Gaza">Gaza</option>
                        <option value="Northern governorates">Northern governorates</option>

                    </select>
                    <br><br>

                    <label>Add a picture <input type="file" name="imges" placeholder="Upload image"></label>
                    <br><br>

                    <label>Notes: <textarea name="notes" id="notes" placeholder="notes" rows="4"></textarea></label>
                    <br><br>
                    <button>Register</button>
                    <button type="reset">Reset</button>

        </fieldset> <br>
        <button><a href="index.html" target="_blank">Back to the main page </a></button>
    </form>
</body>

</html>
