<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>

<body>


    <!-- اعمل جدول منتجات متجر 👨‍💻

1. أول صف: عنوان «منتجات المتجر» بخلية تمتد على 4 أعمدة باستخدام colspan.
2. ثاني صف: عناوين الأعمدة المنتج، السعر، الكمية، القسم.
3. أضف 4 منتجات من اختيارك مع بياناتها.
4. آخر صف: خلية مكتوب فيها «عدد أنواع المنتجات» تمتد على 3 أعمدة، وبجانبها خلية فيها الرقم 4.
5. أظهر حدود الجدول باستخدام border="1" -->

    <table border="1" cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th colspan="4">منتجات المتجر </th>

            </tr>
            <tr>
                <th>المنتج</th>
                <th>السعر</th>
                <th>الكمية</th>
                <th>القسم</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>المنتج 1</td>
                <td>100</td>
                <td>10</td>
                <td>القسم 1</td>
            </tr>
            <tr>
                <td>المنتج 2</td>
                <td>200</td>
                <td>5</td>
                <td>القسم 2</td>
            </tr>
            <tr>
                <td>المنتج 3</td>
                <td>150</td>
                <td>8</td>
                <td>القسم 1</td>
            </tr>
            <tr>
                <td>المنتج 4</td>
                <td>300</td>
                <td>3</td>
                <td>القسم 3</td>
            </tr>
            <tr>
                <th colspan="3">عدد أنواع المنتجات</th>
                <th>4</th>
            </tr>
        </tbody>




    </table>
</body>

</html>
